# fly.toml - Fly.io configuration for Fantasy Copilot Backend
# 
# Deploy: fly deploy
# Logs: fly logs
# Status: fly status

app = "fantasy-copilot-backend"
primary_region = "iad"  # Change to your preferred region

[build]
  dockerfile = "Dockerfile"

[env]
  # Cache configuration
  CACHE_ENABLED = "true"
  CACHE_TTL_SECONDS = "3600"
  
  # Redis will be set via fly secrets or env vars
  # REDIS_HOST will be set when you attach Redis

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0  # Scale to zero when idle

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Secrets to set:
# fly secrets set PERPLEXITY_API_KEY=your_key_here
# fly secrets set REDIS_HOST=your_redis_host (if using external Redis)
# fly secrets set REDIS_PASSWORD=your_password (if needed)
