# fly.toml app configuration file generated for fantasy-copilot-backend on 2026-02-10T02:41:30-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fantasy-copilot-backend'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  CACHE_ENABLED = 'true'
  CACHE_TTL_SECONDS = '3600'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '15s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[metrics]]
  port = 9091
  path = '/metrics'
